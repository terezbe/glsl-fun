<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLSL Shader - Crystal Dreams</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: move;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="glCanvas"></canvas>
    <div class="info">
        Crystal Dreams | GLSL Ray Marching<br>
        Move your mouse to explore
    </div>

    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec2 position;
        void main() {
            gl_Position = vec4(position, 0.0, 1.0);
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        precision highp float;

        uniform vec2 iResolution;
        uniform float iTime;
        uniform vec2 iMouse;

        // Rotation matrix helper
        mat2 rot(float a) {
            float c = cos(a), s = sin(a);
            return mat2(c, -s, s, c);
        }

        // Smooth minimum for organic blending
        float smin(float a, float b, float k) {
            float h = max(k - abs(a - b), 0.0) / k;
            return min(a, b) - h * h * k * 0.25;
        }

        // Distance field function - creates the geometry
        float map(vec3 p) {
            vec3 q = p;

            // Twist the space based on time and depth
            float twist = sin(iTime * 0.3) * 0.5;
            q.xz *= rot(p.y * twist + iTime * 0.15);

            // Create repeating fractal structure with more spacing to avoid clipping
            q = mod(q + 2.0, 4.0) - 2.0;

            // Multiple geometric shapes
            float d1 = length(q) - 0.6;
            float d2 = length(max(abs(q) - 0.4, 0.0)) - 0.15;

            // Add spheres at different scales
            vec3 q2 = mod(p + 1.0, 2.0) - 1.0;
            float d3 = length(q2) - 0.3;

            // Combine with smooth blending
            float d = smin(d1, d2, 0.4);
            d = smin(d, d3, 0.3);

            // Add detail with sine distortion
            float detail = sin(p.x * 5.0 + iTime * 0.5) *
                          sin(p.y * 5.0 + iTime * 0.7) *
                          sin(p.z * 5.0 + iTime * 0.6) * 0.04;
            d += detail;

            return d * 0.8; // Scale down to make scene less dense
        }

        // Ray marching function with improved rendering
        vec4 render(vec2 fragCoord) {
            // Normalize coordinates
            vec2 uv = (fragCoord * 2.0 - iResolution.xy) / iResolution.y;

            // Mouse-controlled camera with smooth interpolation
            vec2 mouse = iMouse * 2.0 - 1.0;
            float camRotX = mouse.y * 1.5;
            float camRotY = mouse.x * 3.14159;

            // Camera setup - moved further back to reduce clipping
            vec3 ro = vec3(0.0, 0.0, -8.0); // ray origin further back
            vec3 rd = normalize(vec3(uv, 1.8)); // ray direction

            // Apply mouse rotation to ray direction
            rd.yz *= rot(camRotX + sin(iTime * 0.15) * 0.2);
            rd.xz *= rot(camRotY + iTime * 0.2);

            // Ray marching with better near-field handling
            float t = 0.5; // Start further from camera to avoid clipping
            vec3 col = vec3(0.0);
            float glow = 0.0;
            float minDist = 1000.0;
            int hitIter = 0;

            for(int i = 0; i < 120; i++) {
                vec3 p = ro + rd * t;
                float d = map(p);

                minDist = min(minDist, d);

                // Accumulate glow with distance falloff
                float glowAmount = 0.008 / (0.005 + abs(d));
                glow += glowAmount * (1.0 - t / 25.0); // Fade glow with distance

                if(d < 0.001 * t) { // Distance threshold scales with depth
                    hitIter = i;
                    // Hit surface - calculate normal for lighting
                    vec2 e = vec2(0.001, 0.0);
                    vec3 n = normalize(vec3(
                        map(p + e.xyy) - map(p - e.xyy),
                        map(p + e.yxy) - map(p - e.yxy),
                        map(p + e.yyx) - map(p - e.yyx)
                    ));

                    // Multiple light sources for better depth
                    vec3 lightPos1 = vec3(sin(iTime * 0.7) * 3.0, 2.0, cos(iTime * 0.7) * 3.0);
                    vec3 lightPos2 = vec3(-sin(iTime * 0.5) * 2.0, -1.0, -cos(iTime * 0.5) * 2.0);

                    vec3 l1 = normalize(lightPos1 - p);
                    vec3 l2 = normalize(lightPos2 - p);

                    float diff1 = max(dot(n, l1), 0.0);
                    float diff2 = max(dot(n, l2), 0.0) * 0.5;

                    float spec1 = pow(max(dot(reflect(-l1, n), -rd), 0.0), 32.0);
                    float spec2 = pow(max(dot(reflect(-l2, n), -rd), 0.0), 16.0);

                    // Improved color palette with more vibrant colors
                    vec3 baseCol1 = 0.5 + 0.5 * cos(vec3(0.0, 1.0, 2.0) + float(hitIter) * 0.08 + iTime * 0.5);
                    vec3 baseCol2 = 0.5 + 0.5 * cos(vec3(2.0, 3.0, 4.0) + p.y * 0.5 + iTime * 0.3);
                    vec3 baseCol = mix(baseCol1, baseCol2, 0.5);

                    // Combine lighting
                    col = baseCol * (diff1 + diff2 + 0.2) +
                          vec3(1.0, 0.9, 0.8) * spec1 +
                          vec3(0.8, 0.9, 1.0) * spec2 * 0.5;

                    // Add ambient occlusion approximation
                    float ao = 1.0 - float(hitIter) / 120.0;
                    col *= 0.5 + 0.5 * ao;

                    break;
                }

                // Adaptive step size with minimum to prevent clipping
                t += max(d * 0.9, 0.02);

                if(t > 25.0) break;
            }

            // Enhanced glow effect with color variation
            vec3 glowCol1 = 0.5 + 0.5 * cos(vec3(0.0, 2.0, 4.0) + iTime * 0.8);
            vec3 glowCol2 = 0.5 + 0.5 * cos(vec3(3.0, 1.0, 2.0) + iTime * 0.6);
            vec3 glowCol = mix(glowCol1, glowCol2, sin(iTime * 0.4) * 0.5 + 0.5);
            col += glowCol * glow * 0.04;

            // Fog/depth for atmosphere (more immersive)
            float fog = 1.0 - exp(-t * 0.08);
            vec3 fogCol = vec3(0.02, 0.05, 0.1) + glowCol * 0.1;
            col = mix(col, fogCol, fog);

            // Vignette effect for focus
            vec2 vigUV = fragCoord / iResolution.xy;
            float vig = 1.0 - dot(vigUV - 0.5, vigUV - 0.5) * 0.8;
            col *= vig;

            // Tone mapping with better color preservation
            col = col / (1.0 + col * 0.8);

            // Subtle color grading
            col = pow(col, vec3(0.9, 0.95, 1.0)); // Slight warm/cool tint

            return vec4(col, 1.0);
        }

        void main() {
            // Anti-aliasing with 2x2 supersampling for smoother edges
            vec4 col = vec4(0.0);
            for(float x = 0.0; x < 2.0; x++) {
                for(float y = 0.0; y < 2.0; y++) {
                    vec2 offset = vec2(x, y) * 0.5;
                    col += render(gl_FragCoord.xy + offset);
                }
            }
            gl_FragColor = col * 0.25;
        }
    </script>

    <script>
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

        if (!gl) {
            alert('WebGL not supported in your browser!');
        }

        // Mouse tracking
        let mouseX = 0.5;
        let mouseY = 0.5;

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX / window.innerWidth;
            mouseY = 1.0 - (e.clientY / window.innerHeight); // Flip Y
        });

        // Touch support for mobile
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            mouseX = touch.clientX / window.innerWidth;
            mouseY = 1.0 - (touch.clientY / window.innerHeight);
        });

        // Resize canvas to fill window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Compile shader
        function compileShader(source, type) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);

            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                const errorMsg = 'Shader compilation error: ' + gl.getShaderInfoLog(shader);
                console.error(errorMsg);
                alert(errorMsg);
                gl.deleteShader(shader);
                return null;
            }

            return shader;
        }

        // Create shader program
        const vertexSource = document.getElementById('vertex-shader').textContent;
        const fragmentSource = document.getElementById('fragment-shader').textContent;

        const vertexShader = compileShader(vertexSource, gl.VERTEX_SHADER);
        const fragmentShader = compileShader(fragmentSource, gl.FRAGMENT_SHADER);

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            const errorMsg = 'Program linking error: ' + gl.getProgramInfoLog(program);
            console.error(errorMsg);
            alert(errorMsg);
        }

        gl.useProgram(program);

        // Set up geometry (fullscreen quad)
        const vertices = new Float32Array([
            -1, -1,
             1, -1,
            -1,  1,
             1,  1
        ]);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

        const positionLocation = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        // Get uniform locations
        const iResolutionLocation = gl.getUniformLocation(program, 'iResolution');
        const iTimeLocation = gl.getUniformLocation(program, 'iTime');
        const iMouseLocation = gl.getUniformLocation(program, 'iMouse');

        // Animation loop
        let startTime = Date.now();

        function render() {
            const currentTime = (Date.now() - startTime) / 1000.0;

            gl.uniform2f(iResolutionLocation, canvas.width, canvas.height);
            gl.uniform1f(iTimeLocation, currentTime);
            gl.uniform2f(iMouseLocation, mouseX, mouseY);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
