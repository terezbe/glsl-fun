<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLSL Shader - Crystal Dreams</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="glCanvas"></canvas>
    <div class="info">
        Crystal Dreams | GLSL Ray Marching<br>
        Inspired by SnakeGem
    </div>

    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec2 position;
        void main() {
            gl_Position = vec4(position, 0.0, 1.0);
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        precision highp float;

        uniform vec2 iResolution;
        uniform float iTime;

        // Rotation matrix helper
        mat2 rot(float a) {
            float c = cos(a), s = sin(a);
            return mat2(c, -s, s, c);
        }

        // Smooth minimum for organic blending
        float smin(float a, float b, float k) {
            float h = max(k - abs(a - b), 0.0) / k;
            return min(a, b) - h * h * k * 0.25;
        }

        // Distance field function - creates the geometry
        float map(vec3 p) {
            vec3 q = p;

            // Twist the space
            float twist = sin(iTime * 0.3) * 0.5;
            q.xz *= rot(p.y * twist + iTime * 0.2);

            // Create repeating fractal structure
            q = mod(q + 1.5, 3.0) - 1.5;

            // Multiple geometric shapes
            float d1 = length(q) - 0.8;
            float d2 = length(max(abs(q) - 0.5, 0.0)) - 0.1;

            // Combine with smooth blending
            float d = smin(d1, d2, 0.3);

            // Add detail with sine distortion
            d += sin(p.x * 4.0 + iTime) * sin(p.y * 4.0) * sin(p.z * 4.0 + iTime) * 0.05;

            return d;
        }

        // Ray marching function
        vec3 render(vec2 fragCoord) {
            // Normalize coordinates
            vec2 uv = (fragCoord * 2.0 - iResolution.xy) / iResolution.y;

            // Camera setup
            vec3 ro = vec3(0.0, 0.0, -5.0); // ray origin
            vec3 rd = normalize(vec3(uv, 1.5)); // ray direction

            // Rotate camera
            rd.yz *= rot(sin(iTime * 0.2) * 0.3);
            rd.xz *= rot(iTime * 0.3);

            // Ray marching
            float t = 0.0;
            vec3 col = vec3(0.0);
            float glow = 0.0;

            for(int i = 0; i < 100; i++) {
                vec3 p = ro + rd * t;
                float d = map(p);

                // Accumulate glow
                glow += 0.015 / (0.01 + abs(d));

                if(d < 0.001) {
                    // Hit surface - calculate normal for lighting
                    vec2 e = vec2(0.001, 0.0);
                    vec3 n = normalize(vec3(
                        map(p + e.xyy) - map(p - e.xyy),
                        map(p + e.yxy) - map(p - e.yxy),
                        map(p + e.yyx) - map(p - e.yyx)
                    ));

                    // Lighting
                    vec3 lightPos = vec3(sin(iTime), 2.0, cos(iTime));
                    vec3 l = normalize(lightPos - p);
                    float diff = max(dot(n, l), 0.0);
                    float spec = pow(max(dot(reflect(-l, n), -rd), 0.0), 32.0);

                    // Color based on position and iteration
                    vec3 baseCol = 0.5 + 0.5 * cos(vec3(1.0, 2.0, 3.0) + float(i) * 0.1 + iTime);
                    col = baseCol * (diff + 0.3) + spec * vec3(1.0);
                    break;
                }

                t += d;

                if(t > 20.0) break;
            }

            // Add glow effect
            vec3 glowCol = 0.5 + 0.5 * cos(vec3(0.0, 2.0, 4.0) + iTime);
            col += glowCol * glow * 0.02;

            // Tone mapping
            col = tanh(col);

            return col;
        }

        void main() {
            vec3 col = render(gl_FragCoord.xy);
            gl_FragColor = vec4(col, 1.0);
        }
    </script>

    <script>
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

        if (!gl) {
            alert('WebGL not supported in your browser!');
        }

        // Resize canvas to fill window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Compile shader
        function compileShader(source, type) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);

            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader compilation error:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }

            return shader;
        }

        // Create shader program
        const vertexSource = document.getElementById('vertex-shader').textContent;
        const fragmentSource = document.getElementById('fragment-shader').textContent;

        const vertexShader = compileShader(vertexSource, gl.VERTEX_SHADER);
        const fragmentShader = compileShader(fragmentSource, gl.FRAGMENT_SHADER);

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error('Program linking error:', gl.getProgramInfoLog(program));
        }

        gl.useProgram(program);

        // Set up geometry (fullscreen quad)
        const vertices = new Float32Array([
            -1, -1,
             1, -1,
            -1,  1,
             1,  1
        ]);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

        const positionLocation = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(positionLocation);
        gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

        // Get uniform locations
        const iResolutionLocation = gl.getUniformLocation(program, 'iResolution');
        const iTimeLocation = gl.getUniformLocation(program, 'iTime');

        // Animation loop
        let startTime = Date.now();

        function render() {
            const currentTime = (Date.now() - startTime) / 1000.0;

            gl.uniform2f(iResolutionLocation, canvas.width, canvas.height);
            gl.uniform1f(iTimeLocation, currentTime);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
